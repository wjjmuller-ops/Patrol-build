{% extends "base.html" %}
{% block content %}

<div class="card">
    <h2>Add Part</h2>
    <form method="post" class="form">
        <input name="name" placeholder="Part name" required>

        <select name="section" required>
            {% for section in sections %}
                <option value="{{ section.name }}">{{ section.name }}</option>
            {% endfor %}
        </select>

        <input name="supplier" placeholder="Supplier">
        <input name="price" type="number" step="0.01" placeholder="Price">

        <select name="status">
            {% for status in statuses %}
                <option>{{ status }}</option>
            {% endfor %}
        </select>

        <textarea name="notes" placeholder="Notes"></textarea>
        <button type="submit">Add Part</button>
    </form>
</div>

<div class="card">
    <h2>Parts</h2>
    {% for part in parts %}
        <div class="list-item">
            <div class="item-header">
                <strong>{{ part.name }}</strong>
                <span class="badge {{ part.status|status_class }}">{{ part.status }}</span>
            </div>
            <p>{{ part.section }} · R {{ "%.2f"|format(part.price) }}</p>
            <small>{{ part.supplier }} {{ part.notes }}</small>
            <div class="actions">
                <a class="btn secondary" href="{{ url_for('edit_part', item_id=part.id) }}">Edit</a>
                <form method="post" action="{{ url_for('delete_part', item_id=part.id) }}" onsubmit="return confirm('Delete this part?')">
                    <button class="danger" type="submit">Delete</button>
                </form>
            </div>
        </div>
    {% else %}
        <p>No parts added yet.</p>
    {% endfor %}
</div>

{% endblock %}
