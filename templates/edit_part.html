{% extends "base.html" %}
{% block content %}

<div class="card">
    <h2>Edit Part</h2>
    <form method="post" class="form">
        <input name="name" value="{{ part.name }}" required>

        <select name="section" required>
            {% for section in sections %}
                <option value="{{ section.name }}" {% if section.name == part.section %}selected{% endif %}>{{ section.name }}</option>
            {% endfor %}
        </select>

        <input name="supplier" value="{{ part.supplier }}">
        <input name="price" type="number" step="0.01" value="{{ part.price }}">

        <select name="status">
            {% for status in statuses %}
                <option {% if status == part.status %}selected{% endif %}>{{ status }}</option>
            {% endfor %}
        </select>

        <textarea name="notes">{{ part.notes }}</textarea>
        <button type="submit">Save Part</button>
        <a class="btn secondary" href="{{ url_for('parts') }}">Cancel</a>
    </form>
</div>

{% endblock %}
