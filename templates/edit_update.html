{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Edit Build Update</h2>
    <form method="post" class="form" enctype="multipart/form-data">
        <input name="title" value="{{ update.title }}" required>
        <select name="section" required>{% for section in sections %}<option value="{{ section.name }}" {% if section.name == update.section %}selected{% endif %}>{{ section.name }}</option>{% endfor %}</select>
        <textarea name="notes">{{ update.notes }}</textarea>
        {% if update.photo %}<img class="thumb large" src="{{ url_for('uploaded_file', filename=update.photo) }}" alt="Update photo">{% endif %}
        <label class="file-label">Replace / add photo <input name="photo" type="file" accept="image/*"></label>
        <button type="submit">Save Update</button>
        <a class="btn secondary" href="{{ url_for('updates') }}">Cancel</a>
    </form>
</div>
{% endblock %}
