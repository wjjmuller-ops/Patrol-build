{% extends "base.html" %}
{% block content %}

<div class="card">
    <h2>Add Build Update</h2>
    <form method="post" class="form">
        <input name="title" placeholder="Update title" required>

        <select name="section" required>
            {% for section in sections %}
                <option value="{{ section.name }}">{{ section.name }}</option>
            {% endfor %}
        </select>

        <textarea name="notes" placeholder="What changed?"></textarea>
        <button type="submit">Add Update</button>
    </form>
</div>

<div class="card">
    <h2>Build Updates</h2>
    {% for update in updates %}
        <div class="list-item">
            <div class="item-header">
                <strong>{{ update.title }}</strong>
                <span class="badge neutral">{{ update.section }}</span>
            </div>
            <p>{{ update.created_at }}</p>
            <small>{{ update.notes }}</small>
            <div class="actions">
                <a class="btn secondary" href="{{ url_for('edit_update', item_id=update.id) }}">Edit</a>
                <form method="post" action="{{ url_for('delete_update', item_id=update.id) }}" onsubmit="return confirm('Delete this update?')">
                    <button class="danger" type="submit">Delete</button>
                </form>
            </div>
        </div>
    {% else %}
        <p>No updates added yet.</p>
    {% endfor %}
</div>

{% endblock %}
