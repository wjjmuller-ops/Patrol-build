{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Edit Cost</h2>
    <form method="post" class="form">
        <input name="title" value="{{ cost.title }}" required>
        <input name="amount" type="number" step="0.01" value="{{ cost.amount }}" required>
        <select name="section" required>{% for section in sections %}<option value="{{ section.name }}" {% if section.name == cost.section %}selected{% endif %}>{{ section.name }}</option>{% endfor %}</select>
        <select name="cost_type">{% for cost_type in cost_types %}<option {% if cost_type == cost.cost_type %}selected{% endif %}>{{ cost_type }}</option>{% endfor %}</select>
        <textarea name="notes">{{ cost.notes }}</textarea>
        <button type="submit">Save Cost</button>
        <a class="btn secondary" href="{{ url_for('costs') }}">Cancel</a>
    </form>
</div>
{% endblock %}
